name: Daily Stock LLM Wiki Builder

on:
  schedule:
    # 每天台灣時間早上 08:00 自動執行（對應 UTC 時間 00:00）
    - cron: '0 0 * * *'
  # 允許在 GitHub 網頁上手動點擊按鈕立即執行測試
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-wiki:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 取得儲存庫最新檔案
        uses: actions/checkout@v4

      - name: 2. 設定雲端 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 執行爬蟲抓取五大類股最新新聞
        run: python crawler.py

      - name: 4. 呼叫 Groq 編譯 LLM Wiki 知識庫
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python wiki_builder.py

      - name: 5. 自動存檔並推送更新至 GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add raw_news/ wiki_knowledge/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: 自動更新每日供應鏈新聞與 LLM Wiki 筆記" && git push)
