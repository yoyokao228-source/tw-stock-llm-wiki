      `;

      document.getElementById("slide-counter").innerText = `${currentIndex + 1} / ${slides.length}`;
      document.getElementById("progress-bar").style.width = `${((currentIndex + 1) / slides.length) * 100}%`;
      document.getElementById("btn-prev").disabled = currentIndex === 0;
      document.getElementById("btn-next").disabled = currentIndex === slides.length - 1;

      // 更新底部圓點
      const dotsEl = document.getElementById("slide-dots");
      dotsEl.innerHTML = slides.map((_, idx) => `
        <button onclick="goToSlide(${idx})" aria-label="第 ${idx + 1} 頁"
          class="w-2.5 h-2.5 rounded-full transition ${idx === currentIndex ? 'bg-blue-500 scale-125' : 'bg-slate-700 hover:bg-slate-500'}">
        </button>
      `).join("");
    }

    function nextSlide() {
      if (currentIndex < slides.length - 1) {
        currentIndex++;
        renderSlide();
      }
    }

    function prevSlide() {
      if (currentIndex > 0) {
        currentIndex--;
        renderSlide();
      }
    }

    function goToSlide(idx) {
      currentIndex = idx;
      renderSlide();
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " ") nextSlide();
      if (e.key === "ArrowLeft") prevSlide();
    });

    // 嘗試讀取 Wiki 的 manifest.json 顯示最新更新時間
    fetch(`wiki_knowledge/manifest.json?t=${Date.now()}`)
      .then(res => res.ok ? res.json() : null)
      .then(data => {
        if (data && data.updated_at) {
          wikiUpdatedText = `知識庫最後自動更新：${data.updated_at}`;
          slides[0].body = slides[0].body.replace("已連結至 tw-stock-llm-wiki 知識庫", wikiUpdatedText);
          if (currentIndex === 0) renderSlide();
        }
      })
      .catch(() => {});

    renderSlide();
  </script>
</body>
</html>
